name: UI regression audit
on:
  push:
    paths: ['web/**', 'index.html', 'sw.js', 'assets/associations/**', 'validation/validate_club_assets.py', 'tests/**', '.github/workflows/ui-tests.yml']
  pull_request:
    paths: ['web/**', 'index.html', 'sw.js', 'assets/associations/**', 'validation/validate_club_assets.py', 'tests/**', '.github/workflows/ui-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated UI test dependency
        run: npm install --prefix "$RUNNER_TEMP/brta-ui-tests" --no-save --ignore-scripts jsdom@26.1.0
      - name: Validate bundled assets
        run: python3 validation/validate_club_assets.py
      - name: Run JavaScript regression suites
        run: |
          for test in tests/*.js; do node "$test"; done
          NODE_PATH="$RUNNER_TEMP/brta-ui-tests/node_modules" node tests/browser/audit.cjs
          NODE_PATH="$RUNNER_TEMP/brta-ui-tests/node_modules" node tests/browser/refinement.cjs

          NODE_PATH="$RUNNER_TEMP/brta-ui-tests/node_modules" node tests/browser/orchestra85.cjs
          NODE_PATH="$RUNNER_TEMP/brta-ui-tests/node_modules" node tests/browser/rm4.cjs

          BRTA_TEST_CLASSIC=1 BRTA_TEST_LEGACY=RM1 NODE_PATH="$RUNNER_TEMP/brta-ui-tests/node_modules" node tests/browser/rm4.cjs
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/brta-playwright" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/brta-playwright/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Check mobile scrolling and scoresheets
        run: |
          python3 -m http.server 8822 --bind 127.0.0.1 > "$RUNNER_TEMP/brta-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 10 --retry-connrefused --silent --fail http://127.0.0.1:8822/ -o /dev/null
          NODE_PATH="$RUNNER_TEMP/brta-playwright/node_modules" node tests/browser/mobile-scroll.cjs
          NODE_PATH="$RUNNER_TEMP/brta-playwright/node_modules" node tests/browser/navigation.cjs
# BRTA Power Ratings 9.9g
