name: Fix the Complaint
on:
  workflow_run:
    workflows: ['Nothing Here! Yet.']
    types: [completed]
    branches: [main]
permissions:
  contents: write
concurrency:
  group: nothing-file-writer
  cancel-in-progress: false
jobs:
  update:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update nothing.txt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            test -f nothing.txt
            cmp -s nothing.txt <(printf '\n') || exit 0
            printf '%s' 'Fixed.' > nothing.txt
            git add nothing.txt
            git commit -m 'Fixed.'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
