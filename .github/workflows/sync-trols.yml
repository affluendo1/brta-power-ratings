name: Sync BRTA results

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * 0,1,3"
      timezone: "Australia/Melbourne"
  push:
    paths:
      - "scraper/sync_trols.py"
      - "generate_site_data.py"
      - ".github/workflows/sync-trols.yml"

permissions:
  contents: write

concurrency:
  group: brta-results-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper and rating dependencies
        run: pip install requests beautifulsoup4 pandas numpy scipy

      - name: Fetch and validate TROLS results
        run: python scraper/sync_trols.py

      - name: Detect new or corrected TROLS results
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- data/current/*.csv; then
            echo "new_results=false" >> "$GITHUB_OUTPUT"
            echo "NEW_RESULTS=false" >> "$GITHUB_ENV"
          else
            echo "new_results=true" >> "$GITHUB_OUTPUT"
            echo "NEW_RESULTS=true" >> "$GITHUB_ENV"
          fi

      - name: Write check heartbeat
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          sync = json.loads(Path("data/current/sync_status.json").read_text())
          heartbeat = {
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "new_results": os.environ.get("NEW_RESULTS") == "true",
              "latest_round": sync["latest_round"],
              "fixtures": sync["fixtures"],
              "completed_fixtures": sync["completed_fixtures"],
              "singles_rubbers": sync["singles_rubbers"],
              "doubles_rubbers": sync["doubles_rubbers"],
              "validation": sync["validation"],
          }
          Path("data/current/last_check.json").write_text(json.dumps(heartbeat, indent=2) + "\n")
          PY

      - name: Recalculate all ratings and website data
        run: python generate_site_data.py

      - name: Commit check and any regenerated ratings
        shell: bash
        run: |
          git config user.name "brta-ratings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/current data.js
          ROUND=$(python -c "import json; print(json.load(open('data/current/sync_status.json'))['latest_round'])")
          if [ "$NEW_RESULTS" = "true" ]; then
            git commit -m "NEW BRTA RESULTS OUT: ratings updated through Round $ROUND"
          else
            git commit -m "TROLS check: no new results through Round $ROUND"
          fi
          git pull --rebase origin main
          git push
