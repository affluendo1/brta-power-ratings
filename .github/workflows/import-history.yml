name: Import TROLS historical seasons

on:
  workflow_dispatch:
  push:
    paths:
      - "scraper/backfill_history.py"
      - "scraper/sync_trols.py"
      - "generate_archive_site_data.py"
      - "generate_site_data.py"
      - "model.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/import-history.yml"

permissions:
  contents: write

concurrency:
  group: brta-archive-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import-history:
    # Live season-selector updates do not require re-fetching the full archive.
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[current-sync-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TROLS_HISTORY_WORKERS: "5"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper and rating dependencies
        run: pip install -r requirements.txt
      - name: Validate importer
        run: python -m unittest discover -s tests -v
      - name: Expand published BRTA history, resuming completed sections
        shell: bash
        env:
          TROLS_HISTORY_MISSING_ONLY: "1"
        run: |
          git config user.name "brta-ratings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for COMP in TA WA HA TN AP AA UA; do
            TROLS_HISTORY_COMPETITIONS="$COMP" python -m scraper.backfill_history
            python generate_archive_site_data.py --missing-only
            git add data/archive
            if ! git diff --cached --quiet; then
              git commit -m "Expand published BRTA history: $COMP"
              git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          done
      - name: Validate expanded archive
        run: |
          python -m unittest discover -s tests -v
          for test in tests/*.js; do node "$test"; done
